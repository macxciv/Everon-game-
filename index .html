<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Everon Conflict</title>
<style>
:root{
  --sea:#6f8b95;
  --sea2:#5f7c86;
  --land:#c9cba8;
  --forest:#adb689;
  --contour:#a38f5e;
  --ink:#22261d;
  --panel:#141811;
  --panel2:#1c2118;
  --line:#3a4331;
  --amber:#d9a441;
  --dim:#8d9480;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --disp:"Arial Narrow","Helvetica Neue",Haettenschweiler,Impact,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--panel);
  color:#e3e6da;
  font-family:var(--mono);
  font-size:13px;
  line-height:1.45;
  overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;background:var(--panel)}

/* ---------- header ---------- */
header{
  flex:0 0 auto;border-bottom:1px solid var(--line);
  padding:8px 12px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#1c2118,#141811);
}
.brand{font-family:var(--disp);font-size:19px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--amber)}
.brand small{display:block;font-size:9px;letter-spacing:.3em;color:var(--dim);font-weight:400}
header .spacer{flex:1}
.iconbtn{
  background:none;border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 7px;border-radius:2px;cursor:pointer;
}
.iconbtn:hover{color:var(--amber);border-color:var(--amber)}
.iconbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- status strip ---------- */
#status{
  flex:0 0 auto;display:flex;align-items:stretch;
  border-bottom:1px solid var(--line);background:var(--panel2);
}
#status .cell{padding:7px 10px;border-right:1px solid var(--line);min-width:0}
#status .cell:last-child{border-right:none;flex:1}
.lbl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:block}
.val{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swatch{display:inline-block;width:9px;height:9px;border:1px solid rgba(0,0,0,.5);margin-right:5px;vertical-align:baseline}

/* ---------- map ---------- */
#mapwrap{flex:1 1 auto;position:relative;background:var(--sea);overflow:hidden;min-height:180px;touch-action:none}
svg#map{display:block;width:100%;height:100%;cursor:grab}
svg#map.grabbing{cursor:grabbing}
#zoomer{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
#zoomer button{
  width:32px;height:32px;background:rgba(20,24,17,.82);border:1px solid var(--line);
  color:#e3e6da;font-size:15px;font-family:var(--mono);border-radius:2px;cursor:pointer;line-height:1;
}
#zoomer button:active{background:var(--amber);color:#141811}
.terrLabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;fill:#3a4232;paint-order:stroke;stroke:rgba(228,230,208,.75);stroke-width:2.4px;stroke-linejoin:round;pointer-events:none}
.cnt{font-family:var(--mono);font-size:12px;font-weight:700;fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:central}
.regionName{font-family:var(--disp);font-size:11px;letter-spacing:.3em;fill:rgba(58,66,50,.5);text-transform:uppercase;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.95}50%{opacity:.25}}
.sel{animation:pulse 1.1s ease-in-out infinite}

/* ---------- console ---------- */
#console{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel2);max-height:46vh;max-height:46dvh;display:flex;flex-direction:column}
#prompt{padding:9px 12px 4px;font-size:12px;color:#cfd4c2}
#prompt b{color:var(--amber);font-weight:700}
#detail{padding:0 12px 8px;font-size:11px;color:var(--dim);min-height:16px}
#actions{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
button.act{
  flex:1 1 auto;min-width:88px;padding:11px 8px;border-radius:2px;cursor:pointer;
  background:#242b1e;border:1px solid var(--line);color:#e3e6da;
  font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
}
button.act:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
button.act:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.act:disabled{opacity:.32;cursor:not-allowed}
button.act.primary{background:var(--amber);color:#141811;border-color:var(--amber)}
button.act.primary:hover:not(:disabled){background:#eab857}
button.act.danger{border-color:#a83a30;color:#e2887f}
button.act.on{background:#3a4a2a;border-color:var(--amber);color:var(--amber)}
#log{
  border-top:1px solid var(--line);padding:8px 12px;overflow-y:auto;flex:1 1 auto;
  font-size:11px;color:#9aa389;min-height:56px;-webkit-overflow-scrolling:touch;
}
#log div{padding:1px 0}
#log .hi{color:#e3e6da}
#log .dice{font-weight:700;letter-spacing:.08em}

/* ---------- overlays ---------- */
.overlay{
  position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,12,8,.93);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.sheet{
  background:var(--panel2);border:1px solid var(--line);max-width:520px;width:100%;
  max-height:88vh;max-height:88dvh;overflow-y:auto;padding:18px;border-radius:3px;
}
.sheet h1{font-family:var(--disp);font-size:26px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 2px;color:var(--amber)}
.sheet h2{font-family:var(--disp);font-size:14px;letter-spacing:.24em;text-transform:uppercase;margin:18px 0 6px;color:#e3e6da;border-bottom:1px solid var(--line);padding-bottom:4px}
.sheet p,.sheet li{font-size:12px;color:#b8bfa9;margin:5px 0}
.sheet ul{padding-left:16px;margin:4px 0}
.sheet .tag{color:var(--amber);font-weight:700}
.seatrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #262d1e}
.seatrow .nm{flex:1;font-size:12px}
.pill{
  border:1px solid var(--line);background:#222a1c;color:#cfd4c2;padding:6px 10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:2px;
}
.pill.on{background:var(--amber);color:#141811;border-color:var(--amber);font-weight:700}
.countrow{display:flex;gap:6px;margin:8px 0 4px}
.countrow .pill{flex:1;text-align:center;padding:10px}
.fld{width:100%;background:#222a1c;border:1px solid var(--line);color:#e3e6da;
  font-family:var(--mono);font-size:12px;padding:9px;border-radius:2px;margin:2px 0 10px}
.pillrow{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 12px}
.edlbl{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
#status.editing{background:#2a2417;border-bottom-color:var(--amber)}
kbd{background:#2a3222;border:1px solid var(--line);padding:1px 5px;border-radius:2px;font-size:10px}
</style>
</head>

    <div id="prompt"></div>

    <div id="actions"></div>

  </div>
</div>

<script>
window.onerror = function(msg, src, line){
  document.body.innerHTML =
    '<div style="padding:22px;font-family:ui-monospace,Menlo,monospace;color:#e3e6da;background:#141811;min-height:100vh">'
    + '<h2 style="color:#d9a441;letter-spacing:.2em">EVERON CONFLICT</h2>'
    + '<p>The game hit an error and stopped.</p>'
    + '<p style="color:#8d9480">' + msg + ' — line ' + line + '</p>'
    + '<p style="color:#8d9480">If the file came through a chat app it may have been altered in transit; '
    + 'it should be about 508 KB. Otherwise try Safari, Chrome or Firefox rather than a file preview.</p></div>';
  return true;
};
var svgPoint = ()=>({x:0,y:0});
/* ============================================================
   EVERON CONFLICT — territory data
   Positions derived from Arma Reforger Everon game coordinates
   (12.8 x 12.8 km terrain), scaled to a 720-unit board.
   ============================================================ */

let REGIONS = {

// terrain: plain | forest | coast | highland ; port: amphibious landing site
let T = [

  {id:"airbase",   name:"Airbase Saint-Philippe", r:"peninsula", x:278, y:71,  t:"plain",    port:false, airbase:true, mob:true, income:2, icon:"✈", inst:"Airbase Saint-Philippe"},

];


let RAW_ADJ = {
  airbase:["stphil","depot"],
  stphil:["depot","meaux"],
  depot:["kermovan"],
  meaux:["tyrone","gravette"],
  kermovan:["tyrone","power"],
  tyrone:["gravette","hornbeam"],
  gravette:["hosp","hornbeam"],
  power:["beacon","hornbeam"],
  beacon:["hornbeam","entre","cbchotain"],

  simonswood:["figari"],
  figari:["mortonvly"],
  mortonvly:["cbmorton","oldwood"],
  oldwood:["cbmorton"],
  cbmorton:["camurac"],
  camurac:["regina"],
  quarry:["blacklake","durras"],
  blacklake:["durras","vernon"],
  durras:["pennants","regina"],
  pennants:["vernon","regina"],
  vernon:["stpierre"]
};
let TT={}, ADJ={}, PORTS=[];
const _shapes={};

// Everything derived from the map definition is rebuilt here, so the editor can
// change territories, roads and regions without anything falling out of step.
function rebuild(){
  TT={}; T.forEach(t=>TT[t.id]=t);
  const sets={}; T.forEach(t=>sets[t.id]=new Set());
  Object.keys(RAW_ADJ).forEach(a=>{
    if(!sets[a]) return;
    RAW_ADJ[a].forEach(b=>{ if(sets[b]){ sets[a].add(b); sets[b].add(a); } });
  });
  ADJ={}; Object.keys(sets).forEach(k=>ADJ[k]=[...sets[k]]);
  PORTS = T.filter(t=>t.port).map(t=>t.id);
  Object.keys(_shapes).forEach(k=>delete _shapes[k]);
  baseDrawn=false;
}

// A snapshot of the shipped map, so "Restore default map" always works.
const DEFAULT_MAP_DATA = JSON.stringify({regions:REGIONS, territories:T, roads:RAW_ADJ});

const FACTIONS = [
  {key:"us",   name:"US Army",             short:"USA",  color:"#3b6ea5"},
  {key:"ussr", name:"Soviet Army",         short:"USSR", color:"#a83a30"},
  {key:"fia",  name:"FIA",                 short:"FIA",  color:"#5c7b2f"},
  {key:"gend", name:"Everon Gendarmerie",  short:"GEND", color:"#7150a3"}
];

/* ============================================================
   Base map artwork
   ============================================================ */

   12.8 km square so it shares one mapping with the territory coordinates:
   board = 20 + fraction * 680.  Clockwise from the northern tip. */
const COAST_F = [

[0.250,0.660],[0.220,0.640],[0.190,0.620],[0.170,0.590],[0.140,0.570],[0.110,0.556],[0.085,0.540],

[0.310,0.286],[0.306,0.256],[0.316,0.230],[0.330,0.206],[0.320,0.180],[0.336,0.156],[0.330,0.126],

const toBoard = f => [Math.round((20+f[0]*680)*10)/10, Math.round((20+f[1]*680)*10)/10];
const COAST = COAST_F.map(toBoard);

// Offshore islets — scenery only, not playable ground.
const ISLETS = [[0.085,0.085,0.038,0.034],[0.845,0.095,0.046,0.040],
                [0.855,0.325,0.014,0.020],[0.225,0.845,0.034,0.030],[0.266,0.886,0.009,0.008]];

function coastPath(){
  return "M"+COAST.map(p=>p.join(",")).join("L")+"Z";
}

// Optional terrain image. Everon is 12800 m square; the board maps that onto
// x/y 20..700, so a full-terrain export drops in at the default values.
let DEFAULT_MAP = null;   // read from the #terrain block at the end of this file
// The bundled terrain composite is built from the open-source EnfusionMapMaker
// project (nickludlam), Arma Public License Share Alike. Everon is Bohemia Interactive.
const BG = {url:null, x:20, y:20, w:680, h:680, opacity:1, name:"Everon terrain (bundled)", err:false};

function drawBase(){
  const g=[];
  g.push(`<rect x="-400" y="-400" width="1520" height="1520" fill="var(--sea)"/>`);
  if(!BG.url){
    for(let i=1;i<=3;i++){
      g.push(`<path d="${coastPath()}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"
        transform="translate(320,340) scale(${1+i*0.05}) translate(-320,-340)"/>`);
    }
  }
  g.push(`<defs>
    <clipPath id="isle"><path d="${coastPath()}"/></clipPath>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(90,110,60,.20)" stroke-width="2"/>
    </pattern>
    ${Object.keys(REGIONS).map(k=>`<radialGradient id="rg_${k}">
      <stop offset="0%" stop-color="${REGIONS[k].tint}" stop-opacity="1"/>
      <stop offset="70%" stop-color="${REGIONS[k].tint}" stop-opacity=".55"/>
      <stop offset="100%" stop-color="${REGIONS[k].tint}" stop-opacity="0"/>
    </radialGradient>`).join("")}
  </defs>`);

  const tints = op => Object.keys(REGIONS).map(k=>{
    const s=regionShape(k);
    return `<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" fill="url(#rg_${k})" opacity="${op}"/>`;
  }).join("");

  if(BG.url){
    g.push(`<image href="${BG.url}" xlink:href="${BG.url}" x="${BG.x}" y="${BG.y}"
      width="${BG.w}" height="${BG.h}" opacity="${BG.opacity}" preserveAspectRatio="none"/>`);
    g.push(`<g>${tints(.20)}</g>`);
    g.push(drawRoads());
    return g.join("");
  }

  // offshore islets
  ISLETS.forEach(([fx,fy,frx,fry])=>{
    g.push(`<ellipse cx="${20+fx*680}" cy="${20+fy*680}" rx="${frx*680}" ry="${fry*680}"
      fill="var(--land)" stroke="#5c6b4a" stroke-width="1.1"/>`);
    g.push(`<ellipse cx="${20+fx*680}" cy="${20+fy*680}" rx="${frx*680*.7}" ry="${fry*680*.7}"
      fill="var(--forest)" opacity=".8"/>`);
  });

  g.push(`<path d="${coastPath()}" fill="var(--land)" stroke="#5c6b4a" stroke-width="1.4" stroke-linejoin="round"/>`);

  const inner=[];
  inner.push(tints(.72));
  // woodland, placed against the redrawn terrain
  const woods=[[276,120,32,24,-10],[302,186,30,22,12],[318,272,38,26,6],[296,352,36,26,-14],
               [172,332,44,28,18],[112,382,28,20,10],[236,262,30,22,-20],[402,398,34,26,-8],
               [330,458,44,30,4],[268,472,30,22,16],[520,588,50,36,14],[566,646,36,26,-12],
               [478,528,34,24,8],[420,462,30,22,-6]];
  woods.forEach(([x,y,rx,ry,rot])=>{
    inner.push(`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${x} ${y})" fill="var(--forest)" opacity=".85"/>`);
    inner.push(`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${x} ${y})" fill="url(#hatch)"/>`);
  });
  // relief — the southeastern massif is the high ground
  const relief=[[534,600,4],[576,650,3],[492,548,3],[452,502,2],[288,150,2],[196,318,2],[330,340,2]];
  relief.forEach(([x,y,n])=>{
    for(let i=1;i<=n+2;i++){
      inner.push(`<ellipse cx="${x}" cy="${y}" rx="${10+i*12}" ry="${8+i*8}"
        fill="none" stroke="var(--contour)" stroke-width=".8" opacity="${.5-i*.055}"
        transform="rotate(${(x+y)%60-30} ${x} ${y})"/>`);
    }
  });
  // 1 km grid (1000 m = 53.125 units)
  for(let i=0;i<=13;i++){
    const p=20+i*53.125;
    inner.push(`<line x1="${p}" y1="-20" x2="${p}" y2="740" stroke="rgba(40,48,32,.16)" stroke-width=".7"/>`);
    inner.push(`<line x1="-20" y1="${p}" x2="740" y2="${p}" stroke="rgba(40,48,32,.16)" stroke-width=".7"/>`);
  }
  g.push(`<g clip-path="url(#isle)">${inner.join("")}</g>`);

  Object.keys(REGIONS).forEach(k=>{
    const s=regionShape(k);
    g.push(`<text class="regionName" x="${s.cx}" y="${s.cy - s.r*0.78}" text-anchor="middle">${REGIONS[k].name.split(" ")[0]}</text>`);
  });

  g.push(drawRoads());
  return g.join("");
}

// A region's tint follows wherever its towns actually sit.

function regionShape(k){
  if(_shapes[k]) return _shapes[k];
  const pts=T.filter(t=>t.r===k);
  const cx=pts.reduce((a,t)=>a+t.x,0)/pts.length;
  const cy=pts.reduce((a,t)=>a+t.y,0)/pts.length;
  const r=Math.max(...pts.map(t=>Math.hypot(t.x-cx,t.y-cy)))+52;
  return _shapes[k]={cx:Math.round(cx),cy:Math.round(cy),r:Math.round(r)};
}

function drawRoads(){
  const g=[], seen=new Set();
  Object.keys(ADJ).forEach(a=>ADJ[a].forEach(b=>{
    const k=[a,b].sort().join("|"); if(seen.has(k))return; seen.add(k);
    const A=TT[a],B=TT[b];
    g.push(`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#3a3524" stroke-width="4.2" stroke-linecap="round" opacity=".6"/>`);
    g.push(`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#efe9d2" stroke-width="2" stroke-linecap="round" opacity=".9"/>`);
  }));
  return g.join("");
}

/* ============================================================
   Game state
   ============================================================ */
let S = null;
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const rnd = n => Math.floor(Math.random()*n);
const $ = id => document.getElementById(id);

const DEALS = {
  scattered: {name:"Scattered",   note:"Interleaved across the whole island. No front line, nobody rushable, seat order barely matters."},
  clusters:  {name:"Clusters",    note:"Three pockets each, grown outward. Local fights everywhere, but no free region."},
  home:      {name:"Home region", note:"One whole region each, as far apart as the map allows, plus a scattered share."},
  mob:       {name:"MOBs",        note:"Two players only. One side deploys from Airbase Saint-Philippe in the far north, the other from the naval base at Saint-Pierre in the south-east, and each grows outward from there."}
};

// Seeds placed as far from one another as the board allows.
function spreadSeeds(k){
  const pool=T.map(t=>t.id), out=[pool[rnd(pool.length)]];
  while(out.length<k && out.length<pool.length){
    let best=null;
    pool.forEach(id=>{
      if(out.includes(id)) return;
      const d=Math.min(...out.map(o=>Math.hypot(TT[id].x-TT[o].x, TT[id].y-TT[o].y)));
      if(!best||d>best.d) best={id,d};
    });
    out.push(best.id);
  }
  return out;
}

function dealTerritories(n, style, cap){
  const owner={}, count=Array.from({length:n},()=>0), homes=[];

  if(style==="home"){
    pickHomeRegions(n).forEach((k,i)=>{
      homes.push(k);
      T.filter(t=>t.r===k).forEach(t=>{ owner[t.id]=i; count[i]++; });
    });
  } else if(style==="clusters"){
    spreadSeeds(n*3).forEach((id,i)=>{ owner[id]=i%n; count[i%n]++; });
  } else if(style==="mob"){
    const seeds = (TT.airbase && TT.stpierre) ? ["airbase","stpierre"] : spreadSeeds(n);
    seeds.slice(0,n).forEach((id,i)=>{ owner[id]=i; count[i]++; });
  }

  let left = T.filter(t=>owner[t.id]===undefined).map(t=>t.id);
  for(let i=left.length-1;i>0;i--){const j=rnd(i+1);[left[i],left[j]]=[left[j],left[i]];}

  while(left.length){
    let lo=0; for(let i=1;i<n;i++) if(count[i]<count[lo]) lo=i;
    if(cap && count[lo]>=cap) break;              // the rest stays neutral
    let pick = left[0];
    if(style!=="scattered"){
      const touching = left.filter(id=>ADJ[id].some(nb=>owner[nb]===lo));
      if(touching.length) pick = touching[rnd(touching.length)];
    }
    owner[pick]=lo; count[lo]++;
    left = left.filter(id=>id!==pick);
  }
  left.forEach(id=>owner[id]=n);                  // FIA holds whatever is left over

  // A main operating base must never sit in neutral hands — the two MOBs are
  // what each side deploys from. Hand any stranded one to the nearer player,
  // who gives up their most distant holding in exchange so counts stay level.
  if(cap && n===2){
    const near=(id,p)=>Math.min(...T.filter(t=>owner[t.id]===p)
      .map(t=>Math.hypot(TT[id].x-t.x, TT[id].y-t.y)));
    T.filter(t=>t.mob && owner[t.id]===n).forEach(m=>{
      const claim = near(m.id,0) <= near(m.id,1) ? 0 : 1;
      const theirs = T.filter(t=>owner[t.id]===claim && !t.mob)
        .sort((a,b)=>Math.hypot(m.x-b.x,m.y-b.y) - Math.hypot(m.x-a.x,m.y-a.y));
      owner[m.id]=claim;
      if(theirs.length) owner[theirs[0].id]=n;
    });
  }
  return {owner, homes, neutral:T.filter(t=>owner[t.id]===n).length};
}

function newGame(seatCfg, style, fia){
  const useFia = !!fia && seatCfg.length===2;
  const starting = useFia ? 42 : {2:60, 3:40, 4:30}[seatCfg.length];
  S = {
    players: seatCfg.map((s,i)=>({i, name:FACTIONS[s.f].name, short:FACTIONS[s.f].short,
                                  color:FACTIONS[s.f].color, ai:s.ai, alive:true}))
      .concat(useFia ? [{i:seatCfg.length, name:"Everon Freedom Alliance", short:"FIA",
                         color:"#5c7b2f", ai:false, alive:true, neutral:true}] : []),
    terr:{}, cur:0, phase:"deploy", pool:0, sel:null,
    subs:seatCfg.map(()=>null), subMoved:false, engage:null, breach:null,
    turns:seatCfg.map(()=>0),
    naval:false, navalUsed:false, airlift:false, airliftUsed:false, fortifyUsed:false,
    log:[], over:false, busy:false, conquered:false
  };
  S.deal = style || "home";
  S.fia = useFia;
  const {owner, homes, neutral} = dealTerritories(seatCfg.length, S.deal,
                                                  useFia ? Math.floor(T.length/3) : null);
  // Everywhere starts garrisoned — ordinary ground 1-3, installations 2-4 —
  // then the rest of the army is scattered over what you hold.
  T.forEach(t=>{ S.terr[t.id]={owner:owner[t.id], troops:(t.income?2:1)+rnd(3)}; });
  S.players.forEach(p=>{
    if(p.neutral) return;                          // FIA fields only its garrisons
    const mine = T.filter(t=>owner[t.id]===p.i).map(t=>t.id);
    let have = mine.reduce((a,id)=>a+S.terr[id].troops,0);
    while(have > starting){
      const pool = mine.filter(id=>S.terr[id].troops>1);
      if(!pool.length) break;
      S.terr[pool[rnd(pool.length)]].troops--; have--;
    }
    while(have < starting){ S.terr[mine[rnd(mine.length)]].troops++; have++; }
  });
  log("Cold War, 1989. One island, and nobody willing to leave it.", true);
  log(`Opening: ${DEALS[S.deal].name.toLowerCase()}.`);
  if(useFia) log(`The FIA holds ${neutral} positions across the middle of the island.`, true);
  homes.forEach((k,i)=>log(`${S.players[i].short} holds the ${REGIONS[k].name}.`));
  beginTurn();
}

// Home regions are chosen to be as far apart as the map allows, so the opening
// has front lines instead of thirty-seven separate skirmishes.
function pickHomeRegions(n){
  const keys = Object.keys(REGIONS).filter(k=>T.some(t=>t.r===k));
  if(keys.length <= n) return keys.slice(0,n);
  const radj = {}; keys.forEach(k=>radj[k]=new Set());
  T.forEach(t=>ADJ[t.id].forEach(nb=>{ if(TT[nb] && TT[nb].r!==t.r) radj[t.r] && radj[t.r].add(TT[nb].r); }));
  let best=null;
  for(let attempt=0; attempt<500; attempt++){
    const pick=[...keys]; for(let i=pick.length-1;i>0;i--){const j=rnd(i+1);[pick[i],pick[j]]=[pick[j],pick[i]];}
    const sel=pick.slice(0,n);
    let touching=0;
    for(let a=0;a<n;a++) for(let b=a+1;b<n;b++) if(radj[sel[a]].has(sel[b])) touching++;
    const sizes=sel.map(k=>T.filter(t=>t.r===k).length);
    const spread=Math.max(...sizes)-Math.min(...sizes);
    const score=touching*10+spread;
    if(!best||score<best.score) best={sel,score};
  }
  return best.sel;
}

function owned(pid){ return T.map(t=>t.id).filter(id=>S.terr[id].owner===pid); }
function regionsHeld(pid){
  return Object.keys(REGIONS).filter(r => T.filter(t=>t.r===r).every(t=>S.terr[t.id].owner===pid));
}
function reinforcements(pid){
  const own = owned(pid);
  const troops = Math.max(3, Math.floor(own.length/3));
  // Nothing you started holding pays out until you have held it through a turn.
  if(S.turns[pid] <= 1) return {total:troops, troops, bonus:0, inst:0, first:true};
  const bonus = regionsHeld(pid).reduce((a,r)=>a+REGIONS[r].bonus,0);
  const inst = own.reduce((a,id)=>a+(TT[id].income||0),0);
  return {total:troops+bonus+inst, troops, bonus, inst, first:false};
}

function log(txt, hi){
  S.log.unshift({txt, hi:!!hi});
  if(S.log.length>50) S.log.pop();
}

function beginTurn(){
  const p = S.players[S.cur];
  S.turns[p.i]++;
  S.phase="deploy"; S.sel=null; S.conquered=false;
  S.naval=false; S.navalUsed=false; S.airlift=false; S.airliftUsed=false; S.fortifyUsed=false;
  S.subMoved=false; S.engage=null; S.breach=null;
  const held = regionsHeld(p.i);
  if(held.length>=5){ return endGame(p, "operational control of five regions"); }
  const r = reinforcements(p.i);
  S.pool = r.total;
  const parts=[`${r.troops} from ground`];
  if(r.bonus) parts.push(`${r.bonus} from ${held.length} region${held.length>1?"s":""}`);
  if(r.inst) parts.push(`${r.inst} from installations`);
  if(r.first) parts.push("regions and installations pay from next turn");
  log(`— ${p.name} turn: ${r.total} reinforcements (${parts.join(", ")}) —`, true);
  render();
  if(p.ai) aiTurn();
}

function nextPlayer(){
  S.players.forEach(p=>{ if(p.alive && owned(p.i).length===0){
    p.alive=false;
    log(p.neutral ? "The FIA is driven from the island." : `${p.name} eliminated.`, true);
  }});
  const live = S.players.filter(p=>p.alive && !p.neutral);
  if(live.length===1 && S.players.filter(p=>!p.neutral).length>1)
    return endGame(live[0], "total conquest");
  let n = S.cur;
  do { n=(n+1)%S.players.length; } while(!S.players[n].alive || S.players[n].neutral);
  S.cur=n; beginTurn();
}

function endGame(p, how){
  S.over=true; S.phase="over";
  log(`${p.name} wins by ${how}.`, true);
  render();
  showEnd(p, how);
}

/* ============================================================
   Combat
   ============================================================ */
function d6(){ return 1+rnd(6); }
function battle(from, to){
  const A=S.terr[from], D=S.terr[to];
  const aN=Math.min(3, A.troops-1), dN=Math.min(2, D.troops);
  const a=Array.from({length:aN},d6).sort((x,y)=>y-x);
  let d=Array.from({length:dN},d6);
  const hi = TT[to].t==="highland";
  if(hi && d.length) d[0]=Math.min(6, d[0]+1);
  d.sort((x,y)=>y-x);
  let aL=0,dL=0;
  for(let i=0;i<Math.min(aN,dN);i++){ if(a[i]>d[i]) dL++; else aL++; }
  A.troops-=aL; D.troops-=dL;
  return {a,d,aL,dL,aN,hi};
}

const SUB_HULL = 3, BREAK_OFF_COST = 2, SUB_ROUNDS = 3;

// A naval landing against a screened port is intercepted at sea. The convoy
// fights in rounds and may break off between them, at a price.
function beginIntercept(from, to){
  const owner = S.terr[to].owner;
  S.engage = {from, to, owner, hull:SUB_HULL, round:0};
  S.navalUsed = true; S.naval = false;
  log(`${S.players[owner].short} submarine intercepts the crossing to ${TT[to].name}.`, true);
  render();
}

function interceptRound(){
  const e = S.engage, A = S.terr[e.from];
  const aN = Math.min(3, A.troops-1);
  if(aN < 1) return convoyTurnsBack(0);
  e.round++;
  const a = Array.from({length:aN}, d6).sort((x,y)=>y-x);
  const d = Array.from({length:2}, d6);
  d[0] = Math.min(6, d[0]+1);            // submerged: hard to land a hit on
  d.sort((x,y)=>y-x);
  let aL=0, dL=0;
  for(let i=0;i<Math.min(aN,2);i++){ if(a[i]>d[i]) dL++; else aL++; }
  A.troops -= aL; e.hull -= dL;
  log(`Pass ${e.round} <span class="dice">[${a.join(" ")}] v [${d.join(" ")}]</span> — convoy ${aL}, submarine ${dL}`);
  if(e.hull <= 0){
    S.subs[e.owner] = null;
    log(`${S.players[e.owner].short} submarine sunk. The way to ${TT[e.to].name} is open.`, true);
    S.breach = {from:e.from, to:e.to};
    S.sel = e.from; S.pendingTarget = e.to; S.engage = null;
    render(); return;
  }
  if(S.terr[e.from].troops < 2) return convoyTurnsBack(0);
  if(e.round >= SUB_ROUNDS) return convoyTurnsBack(0);
  render();
}

function convoyTurnsBack(cost){
  const e = S.engage, A = S.terr[e.from];
  const paid = Math.max(0, Math.min(cost, A.troops-1));
  A.troops -= paid;
  log(paid ? `Convoy breaks off for ${TT[e.to].name}, ${paid} lost covering the withdrawal.`
           : `Convoy is driven off from ${TT[e.to].name}. The submarine holds the approach.`, true);
  S.engage = null; S.sel = e.from; S.pendingTarget = null;
  render();
}

function doAttack(from, to, blitz){
  const pid=S.players[S.cur].i;
  let rounds=0, taken=false, last=null;
  do{
    if(S.terr[from].troops<2 || S.terr[to].troops<1) break;
    const res=battle(from,to); last=res; rounds++;
    if(rounds<=1 || !blitz){
      log(`${TT[from].name} → ${TT[to].name} <span class="dice">[${res.a.join(" ")}] v [${res.d.join(" ")}]</span>${res.hi?" (highland +1)":""} — lost ${res.aL}/${res.dL}`);
    }
    if(S.terr[to].troops<=0){
      const move=Math.max(1, Math.min(res.aN, S.terr[from].troops-1));
      const prev=S.terr[to].owner;
      S.terr[to].owner=pid; S.terr[to].troops=move; S.terr[from].troops-=move;
      log(`${TT[to].name} taken. ${move} moved in.`, true);
      if(S.subs[prev]===to){ S.subs[prev]=null; log(`${S.players[prev].short} submarine lost with its home port.`, true); }
      taken=true; S.conquered=true;
      if(owned(prev).length===0){ S.players[prev].alive=false;
        log(S.players[prev].neutral ? "The FIA is driven from the island." : `${S.players[prev].name} eliminated.`, true); }
      break;
    }
  } while(blitz && S.terr[from].troops>1);
  if(blitz && rounds>1 && !taken) log(`${TT[from].name} → ${TT[to].name}: assault stalled after ${rounds} rounds.`);
  if(S.naval && rounds>0){ S.navalUsed=true; S.naval=false; log("Naval landing expended."); }
  S.sel = taken ? to : from;
  const live=S.players.filter(p=>p.alive && !p.neutral);
  if(live.length===1 && S.players.filter(p=>!p.neutral).length>1){ endGame(live[0],"total conquest"); return; }
  if(owned(pid).length===T.length){ endGame(S.players[pid],"total conquest"); return; }
  render();
}

/* ============================================================
   Legal-move helpers
   ============================================================ */
const SUB_COST = 8, SUB_COST_YARD = 4;
// Saint-Pierre is a naval base — boats built there cost half.
function subCost(pid){
  return T.some(t=>t.shipyard && S.terr[t.id].owner===pid) ? SUB_COST_YARD : SUB_COST;
}
// A submarine patrols the region it is stationed in, screening every port its
// owner holds there against naval landings. It does nothing against land attacks.
function subGuards(id){
  const t=TT[id]; if(!t || !t.port) return false;
  const st=S.subs[S.terr[id].owner];
  return !!(st && TT[st] && TT[st].r===t.r);
}
function subOf(pid){ const st=S.subs[pid]; return (st && TT[st]) ? st : null; }

function attackTargets(from){
  const pid=S.players[S.cur].i;
  if(S.terr[from].owner!==pid || S.terr[from].troops<2) return [];
  let list = ADJ[from].filter(n=>S.terr[n].owner!==pid);
  if(S.naval && TT[from].port)
    list = list.concat(PORTS.filter(p=>S.terr[p].owner!==pid && p!==from));
  if(S.breach && S.breach.from===from) list.push(S.breach.to);
  return [...new Set(list)];
}
function connected(from){ // owned territories reachable through owned ground
  const pid=S.players[S.cur].i, seen=new Set([from]), q=[from];
  while(q.length){ const c=q.pop();
    ADJ[c].forEach(n=>{ if(!seen.has(n) && S.terr[n].owner===pid){ seen.add(n); q.push(n);} }); }
  seen.delete(from); return [...seen];
}
function moveTargets(from){
  const pid=S.players[S.cur].i;
  if(S.terr[from].owner!==pid || S.terr[from].troops<2) return [];
  if(S.airlift) return owned(pid).filter(id=>id!==from);
  return connected(from);
}
function highlights(){
  if(ED.on) return ED.sel ? (ADJ[ED.sel]||[]) : [];
  if(!S.sel || S.over) return [];
  if(S.phase==="attack") return attackTargets(S.sel);
  if(S.phase==="fortify") return moveTargets(S.sel);
  return [];
}

/* ============================================================
   Rendering
   ============================================================ */
let view = {x:0,y:0,w:720,h:720};
let baseDrawn=false;

function render(){
  if(!S) return;
  if(ED.on){ renderEdStatus(); renderMap(); renderEdConsole(); renderLog(); return; }
  $("status").classList.remove("editing");
  renderStatus(); renderMap(); renderConsole(); renderLog();
}

function renderStatus(){
  const p=S.players[S.cur], r=reinforcements(p.i);
  const held=regionsHeld(p.i);
  $("status").innerHTML = `
    <div class="cell"><span class="lbl">Force</span>
      <span class="val"><span class="swatch" style="background:${p.color}"></span>${p.short}${p.ai?" ·AI":""}</span></div>
    <div class="cell"><span class="lbl">Phase</span><span class="val">${
      S.over?"Ended":S.phase==="deploy"?`Deploy ${S.pool}`:S.phase[0].toUpperCase()+S.phase.slice(1)}</span></div>
    <div class="cell"><span class="lbl">Held</span><span class="val">${owned(p.i).length}/${T.length} · ${held.length} rgn</span></div>
    <div class="cell"><span class="lbl">This turn</span><span class="val">+${r.total}</span></div>`;
}

function renderMap(){
  const svg=$("map");
  const hl=new Set(highlights());
  const pid=S.players[S.cur].i;
  const dyn=[];
  T.forEach(t=>{
    const c = ED.on ? null : S.terr[t.id];
    const p = ED.on ? {color:(REGIONS[t.r]||{tint:"#8a8f7a"}).tint} : S.players[c.owner];
    const isSel = ED.on ? ED.sel===t.id : S.sel===t.id;
    const isHl = hl.has(t.id);
    // NATO-style counter
    const w=34,h=22, x=t.x-w/2, y=t.y-h/2;
    dyn.push(`<g class="node" data-id="${t.id}">`);
    if(isHl) dyn.push(`<rect x="${x-5}" y="${y-5}" width="${w+10}" height="${h+10}" fill="none" stroke="#fff" stroke-width="2.4" opacity=".9" class="sel"/>`);
    if(isSel) dyn.push(`<rect x="${x-6}" y="${y-6}" width="${w+12}" height="${h+12}" fill="none" stroke="var(--amber)" stroke-width="3"/>`);
    dyn.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${p.color}" stroke="#1a1d15" stroke-width="1.6" rx="1"/>`);
    dyn.push(`<path d="M${x},${y} L${x+w},${y+h} M${x+w},${y} L${x},${y+h}" stroke="rgba(255,255,255,.32)" stroke-width="1"/>`);
    dyn.push(`<text class="cnt" x="${t.x}" y="${t.y+.5}" ${ED.on?'style="fill:#22261d"':''}>${ED.on?(ADJ[t.id]||[]).length:c.troops}</text>`);
    const icon = t.icon || null;
    if(icon) dyn.push(`<text x="${x+w+2}" y="${y+8}" font-size="10" fill="#f4efdc" stroke="#1a1d15" stroke-width="2.2" paint-order="stroke" font-family="monospace">${icon}</text>`);
    if(t.t==="highland") dyn.push(`<text x="${x-11}" y="${y+8}" font-size="9" fill="#4a4326" font-family="monospace">▲</text>`);
    if(t.port)    dyn.push(`<text x="${x-11}" y="${y+19}" font-size="9" fill="#2f4650" font-family="monospace">⚓</text>`);
    if(!ED.on && subGuards(t.id))
      dyn.push(`<circle cx="${t.x}" cy="${t.y}" r="23" fill="none" stroke="${p.color}"
        stroke-width="1.6" stroke-dasharray="3 4" opacity=".8"/>`);
    if(!ED.on && S.subs.indexOf(t.id)>-1){
      const sc=S.players[S.subs.indexOf(t.id)].color;
      dyn.push(`<g transform="translate(${t.x},${t.y-19})">
        <ellipse rx="10" ry="3.6" fill="${sc}" stroke="#12150e" stroke-width="1.3"/>
        <path d="M-2.4,-3 L-2.4,-7.5 L2.4,-7.5 L2.4,-3 Z" fill="${sc}" stroke="#12150e" stroke-width="1.1"/>
        <line x1="9" y1="-1.4" x2="13.5" y2="-4" stroke="#12150e" stroke-width="1.3"/>
      </g>`);
    }
    dyn.push(`<text class="terrLabel" x="${t.x}" y="${y+h+11}" text-anchor="middle">${t.name.toUpperCase()}</text>`);
    dyn.push(`<circle cx="${t.x}" cy="${t.y}" r="26" fill="transparent"/>`);
    dyn.push(`</g>`);
  });
  if(!baseDrawn){ svg.innerHTML = `<g id="baseLayer">${drawBase()}</g><g id="dynLayer"></g>`; baseDrawn=true; }
  $("dynLayer").innerHTML = dyn.join("");
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
}

function btn(label,{on,fn,cls,dis}={}){
  const b=document.createElement("button");
  b.className="act "+(cls||"")+(on?" on":"");
  b.textContent=label; b.disabled=!!dis;
  if(fn) b.onclick=fn;
  return b;
}

function renderConsole(){
  const p=S.players[S.cur];
  const A=$("actions"); A.innerHTML="";
  const D=$("detail");

  if(S.over){
    $("prompt").innerHTML=`<b>Campaign over.</b>`;
    D.textContent="Start a new campaign from the New button.";
    return;
  }
  if(p.ai && S.busy){
    $("prompt").innerHTML=`<b>${p.short}</b> is issuing orders…`;
    D.textContent="";
    return;
  }

  const selT = S.sel ? TT[S.sel] : null;
  if(selT){
    const c=S.terr[S.sel];
    const bits=[REGIONS[selT.r].name, selT.t, `${c.troops} troops`, S.players[c.owner].short];
    if(selT.t==="highland") bits.push("defender +1");
    if(selT.port) bits.push("port");
    if(selT.inst) bits.push(selT.inst);
    if(!ED.on && subGuards(S.sel)) bits.push("screened by submarine");
    if(!ED.on && S.subs.indexOf(S.sel)>-1) bits.push("submarine stationed");
    D.textContent = selT.name+" — "+bits.join(" · ");
  } else D.textContent = "";

  if(S.phase==="deploy"){
    $("prompt").innerHTML = `<b>Deploy</b> — ${S.pool} left. Tap your own ground to reinforce it.`;
    A.append(btn("+5 here", {dis:!(S.sel && S.terr[S.sel].owner===p.i && S.pool>0),
      fn:()=>{const n=Math.min(5,S.pool); S.terr[S.sel].troops+=n; S.pool-=n; if(S.pool===0)S.phase="attack"; render();}}));
    A.append(btn("All here", {dis:!(S.sel && S.terr[S.sel].owner===p.i && S.pool>0),
      fn:()=>{S.terr[S.sel].troops+=S.pool; S.pool=0; S.phase="attack"; render();}}));
    const cost = subCost(p.i);
    A.append(btn(`Commission sub (${cost})`, {
      dis:!(S.sel && S.terr[S.sel].owner===p.i && TT[S.sel].port && S.pool>=cost && !subOf(p.i)),
      fn:()=>{ S.pool-=cost; S.subs[p.i]=S.sel;
               log(`${p.short} submarine commissioned at ${TT[S.sel].name}.`, true);
               if(S.pool===0){S.phase="attack"; S.sel=null;} render(); }}));
    A.append(btn("To attack", {cls:"primary", dis:S.pool>0, fn:()=>{S.phase="attack"; S.sel=null; render();}}));
    return;
  }

  if(S.phase==="attack"){
    const tg = S.sel ? attackTargets(S.sel) : [];
    $("prompt").innerHTML = S.sel && S.terr[S.sel].owner===p.i
      ? (tg.length ? `<b>Attack</b> — tap a flashing target from ${TT[S.sel].name}.`
                   : `<b>Attack</b> — ${TT[S.sel].name} has no valid target. Pick another unit.`)
      : `<b>Attack</b> — tap one of your positions with 2+ troops.`;
    if(S.engage){
      const e=S.engage;
      $("prompt").innerHTML = `<b>Intercepted at sea</b> — submarine screening ${TT[e.to].name}.`;
      D.textContent = `Pass ${e.round+1} of ${SUB_ROUNDS} · convoy ${S.terr[e.from].troops} at ${TT[e.from].name} · submarine hull ${e.hull}/${SUB_HULL}`;
      A.append(btn("Press on", {cls:"danger", fn:interceptRound}));
      A.append(btn(`Break off (−${BREAK_OFF_COST})`, {fn:()=>convoyTurnsBack(BREAK_OFF_COST)}));
      return;
    }
    const navalRun = S.pendingTarget && S.naval && !ADJ[S.sel].includes(S.pendingTarget) && subGuards(S.pendingTarget);
    A.append(btn(navalRun?"Sail":"Roll once", {dis:!(S.sel && S.pendingTarget && attackTargets(S.sel).includes(S.pendingTarget)),
      fn:()=> navalRun ? beginIntercept(S.sel,S.pendingTarget) : doAttack(S.sel,S.pendingTarget,false)}));
    A.append(btn("Blitz", {dis:!(S.sel && S.pendingTarget && attackTargets(S.sel).includes(S.pendingTarget)) || navalRun,
      cls:"danger", fn:()=>doAttack(S.sel,S.pendingTarget,true)}));
    A.append(btn(S.naval?"Naval: armed":"Naval landing", {on:S.naval, dis:S.navalUsed,
      fn:()=>{S.naval=!S.naval; render();}}));
    A.append(btn("To fortify", {cls:"primary", fn:()=>{S.phase="fortify"; S.sel=null; S.pendingTarget=null; render();}}));
    if(S.pendingTarget) D.textContent = `${TT[S.sel].name} (${S.terr[S.sel].troops}) → ${TT[S.pendingTarget].name} (${S.terr[S.pendingTarget].troops}${TT[S.pendingTarget].t==="highland"?", highland":""})`
      + (navalRun ? " — submarine screening this port" : "");
    return;
  }

  if(S.phase==="fortify"){
    $("prompt").innerHTML = S.fortifyUsed
      ? `<b>Fortify</b> — move already made. End the turn.`
      : (S.sel && S.terr[S.sel].owner===p.i
          ? `<b>Fortify</b> — tap a flashing destination.`
          : `<b>Fortify</b> — tap a position with 2+ troops to move from.`);
    const canMove = S.sel && S.pendingTarget && !S.fortifyUsed && moveTargets(S.sel).includes(S.pendingTarget);
    A.append(btn("Move 1", {dis:!canMove, fn:()=>fortify(1)}));
    A.append(btn("Move all", {dis:!canMove, fn:()=>fortify(S.terr[S.sel].troops-1)}));
    A.append(btn(S.airlift?"Airlift: armed":"Airlift", {on:S.airlift,
      dis:!T.some(t=>t.airbase && S.terr[t.id].owner===p.i) || S.airliftUsed || S.fortifyUsed,
      fn:()=>{S.airlift=!S.airlift; render();}}));
    A.append(btn("Station sub", {
      dis:!(subOf(p.i) && !S.subMoved && S.sel && S.terr[S.sel].owner===p.i && TT[S.sel].port && S.sel!==S.subs[p.i]),
      fn:()=>{ log(`${p.short} submarine moves to ${TT[S.sel].name}.`);
               S.subs[p.i]=S.sel; S.subMoved=true; S.sel=null; render(); }}));
    A.append(btn("End turn", {cls:"primary", fn:()=>{S.pendingTarget=null; nextPlayer();}}));
    if(S.pendingTarget) D.textContent = `${TT[S.sel].name} (${S.terr[S.sel].troops}) → ${TT[S.pendingTarget].name} (${S.terr[S.pendingTarget].troops})`;
  }
}

function fortify(n){
  n=Math.max(1, Math.min(n, S.terr[S.sel].troops-1));
  S.terr[S.sel].troops-=n; S.terr[S.pendingTarget].troops+=n;
  log(`${n} moved ${TT[S.sel].name} → ${TT[S.pendingTarget].name}${S.airlift?" by air":""}.`);
  if(S.airlift){ S.airliftUsed=true; S.airlift=false; } else { S.fortifyUsed=true; }
  S.sel=null; S.pendingTarget=null; render();
}

function renderLog(){
  $("log").innerHTML = S.log.map(l=>`<div class="${l.hi?"hi":""}">${l.txt}</div>`).join("");
}

   Input
   ============================================================ */
function onNodeTap(id){
  if(ED.on) return edNodeTap(id);
  if(!S || S.over || S.busy || S.players[S.cur].ai) return;
  const pid=S.players[S.cur].i;
  if(S.phase==="deploy"){
    if(S.terr[id].owner===pid){
      S.sel=id;
      if(S.pool>0){ S.terr[id].troops++; S.pool--; if(S.pool===0){S.phase="attack"; S.sel=null;} }
    }
    render(); return;
  }
  if(S.phase==="attack"){
    if(S.sel && attackTargets(S.sel).includes(id)){ S.pendingTarget=id; render(); return; }
    S.sel = (S.terr[id].owner===pid) ? id : null; S.pendingTarget=null; render(); return;
  }
  if(S.phase==="fortify"){
    if(S.sel && moveTargets(S.sel).includes(id)){ S.pendingTarget=id; render(); return; }
    S.sel = (S.terr[id].owner===pid && S.terr[id].troops>1) ? id : null; S.pendingTarget=null; render(); return;
  }
}

(function wireMap(){
  const svg=$("map"), wrap=$("mapwrap");
  let dragging=false, moved=0, lx=0, ly=0, pinch=null;
  const unit = () => view.w / svg.getBoundingClientRect().width;

  wrap.addEventListener("pointerdown", e=>{
    if(e.isPrimary===false) return;
    dragging=true; moved=0; lx=e.clientX; ly=e.clientY;
    svg.classList.add("grabbing");
  });
  window.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>8){ view.x-=dx*unit(); view.y-=dy*unit(); clampView(); renderMap(); }
  });
  window.addEventListener("pointerup", ()=>{ dragging=false; svg.classList.remove("grabbing"); });
  window.addEventListener("pointercancel", ()=>{dragging=false;svg.classList.remove("grabbing");});
  svg.addEventListener("click", e=>{
    if(moved>8) return;
    const g=e.target.closest && e.target.closest(".node");
    if(g){ onNodeTap(g.dataset.id); return; }
    if(ED.on) edGroundTap(svgPoint(e));
  });
  svgPoint = e=>{
    const r=svg.getBoundingClientRect();
    const scale=Math.min(r.width/view.w, r.height/view.h);
    const ox=(r.width-view.w*scale)/2, oy=(r.height-view.h*scale)/2;
    return {x: Math.round(view.x+(e.clientX-r.left-ox)/scale),
            y: Math.round(view.y+(e.clientY-r.top -oy)/scale)};
  };
  wrap.addEventListener("wheel", e=>{ e.preventDefault(); zoom(e.deltaY<0?1.15:1/1.15); }, {passive:false});

  $("zin").onclick=()=>zoom(1.3);
  $("zout").onclick=()=>zoom(1/1.3);
  $("zfit").onclick=()=>{view={x:0,y:0,w:720,h:720}; renderMap();};
})();

function zoom(f){
  const cx=view.x+view.w/2, cy=view.y+view.h/2;
  let w=Math.min(760, Math.max(190, view.w/f));
  view.w=w; view.h=w; view.x=cx-w/2; view.y=cy-w/2; clampView(); renderMap();
}
function clampView(){
  view.x=Math.max(-140, Math.min(860-view.w, view.x));
  view.y=Math.max(-140, Math.min(860-view.h, view.y));
}

/* ============================================================
   AI
   ============================================================ */
async function aiTurn(){
  S.busy=true; render();
  const pid=S.players[S.cur].i;
  await sleep(500);

  // --- a boat, if there are ports worth screening
  const myPorts = PORTS.filter(id=>S.terr[id].owner===pid);
  if(!subOf(pid) && myPorts.length>=2 && S.pool>=subCost(pid)+3){
    const byRegion={};
    myPorts.forEach(id=>{ byRegion[TT[id].r]=(byRegion[TT[id].r]||[]).concat(id); });
    const best=Object.values(byRegion).sort((a,b)=>b.length-a.length)[0];
    S.pool-=subCost(pid); S.subs[pid]=best[0];
    log(`${S.players[pid].short} submarine commissioned at ${TT[best[0]].name}.`, true);
  }

  // --- deploy: weight borders by local pressure
  const own=owned(pid);
  const borders=own.filter(id=>ADJ[id].some(n=>S.terr[n].owner!==pid));
  if(borders.length){
    const score=id=>{
      const threat=ADJ[id].filter(n=>S.terr[n].owner!==pid).reduce((a,n)=>a+S.terr[n].troops,0);
      const weakest=Math.min(...ADJ[id].filter(n=>S.terr[n].owner!==pid).map(n=>S.terr[n].troops));
      return threat - S.terr[id].troops + (weakest<=2?4:0);
    };
    borders.sort((a,b)=>score(b)-score(a));
    const main=borders[0], second=borders[1]||main;
    const half=Math.ceil(S.pool*0.65);
    S.terr[main].troops+=half; S.terr[second].troops+=S.pool-half;
    log(`${S.players[pid].short} reinforces ${TT[main].name}${second!==main?` and ${TT[second].name}`:""}.`);
    S.pool=0;
  } else { S.terr[own[0]].troops+=S.pool; S.pool=0; }
  S.phase="attack"; render(); await sleep(650);

  // --- attack: take favourable odds, up to 8 assaults
  for(let k=0;k<8;k++){
    let best=null;
    owned(pid).forEach(from=>{
      if(S.terr[from].troops<3) return;
      ADJ[from].filter(n=>S.terr[n].owner!==pid).forEach(to=>{
        const edge=S.terr[from].troops - S.terr[to].troops - (TT[to].t==="highland"?1:0);
        if(edge<2) return;
        let v=edge;
        v += (TT[to].income||0)*3;
        if(T.filter(t=>t.r===TT[to].r).every(t=>t.id===to||S.terr[t.id].owner===pid)) v+=5;
        if(!best||v>best.v) best={from,to,v};
      });
    });
    if(!best) break;
    S.sel=best.from; render(); await sleep(350);
    doAttack(best.from,best.to,true);
    if(S.over){S.busy=false;return;}
    await sleep(420);
  }

  // --- fortify: interior reserves to the hottest border
  S.phase="fortify"; S.sel=null; render(); await sleep(400);
  const mine=owned(pid);
  const interior=mine.filter(id=>S.terr[id].troops>3 && ADJ[id].every(n=>S.terr[n].owner===pid));
  if(interior.length){
    const src=interior.sort((a,b)=>S.terr[b].troops-S.terr[a].troops)[0];
    const reach=connected(src).filter(id=>ADJ[id].some(n=>S.terr[n].owner!==pid));
    if(reach.length){
      const dst=reach.sort((a,b)=>S.terr[a].troops-S.terr[b].troops)[0];
      const n=S.terr[src].troops-1;
      S.terr[src].troops-=n; S.terr[dst].troops+=n;
      log(`${S.players[pid].short} shifts ${n} to ${TT[dst].name}.`);
    }
  }
  render(); await sleep(500);
  S.busy=false; S.sel=null;
  nextPlayer();
}

<p>The two-player default is a <span class="tag">MOB</span> start, the way Conflict opens. One side deploys from Airbase Saint-Philippe at the northern tip, the other from the naval base at Saint-Pierre in the south-east, and each grows outward from its main operating base.</p>
<p>In a two-player game the <span class="tag">Everon Freedom Alliance</span> can hold the middle. You each take twelve positions at opposite ends of the island and the resistance garrisons the thirteen between you. The FIA never takes a turn and never attacks, but its ground is held and has to be cleared — so there is somewhere to grow that is not your opponent's face.</p>
<p>Every position starts garrisoned rather than empty — ordinary ground holds 1 to 3, installations 2 to 4 — and the rest of your army is scattered over what you hold. Two players field 60 troops each head to head, or 42 each with the FIA holding the middle. Three players field 40, four field 30.</p>
<p>On your <em>first</em> turn you draw ground income only — territories ÷ 3, minimum 3. Regions and installations start paying from your second turn. Ground you were handed has to be held before it funds you.</p>
<p><span class="tag">Deploy.</span> You get territories ÷ 3 (minimum 3), plus a bonus for every region you hold outright, plus whatever your installations pay. Tap your own counters to place them.</p>
    <p><span class="tag">Attack.</span> Pick a position with 2+ troops, then a bordering enemy. Attacker rolls up to 3 dice, defender up to 2. Highest against highest, ties go to the defender. Take the last defender out and the attacking dice move in. <em>Blitz</em> repeats until the attack breaks or the town falls.</p>
    <p><span class="tag">Fortify.</span> One move per turn, any distance through your own connected ground.</p>
    <h2>Installations</h2>
    <p>Ten military sites each pay reinforcements while you hold them. They sit apart from the region bonuses, so a player locked out of a whole region can still fund a war by taking bases.</p>
    <ul>
      <li><span class="tag">✈ Airbase Saint-Philippe</span> +2 — the island's only paved runway. Also grants one <em>airlift</em> per turn: move troops between any two territories you hold, connected or not.</li>
      <li><span class="tag">⚑ Saint-Pierre Naval Base</span> +2 — the southern main operating base. Submarines commissioned while you hold it cost <span class="tag">4</span> instead of 8.</li>
      <li><span class="tag">▣ Military Depot</span> +1 &nbsp; <span class="tag">▣ Quarry</span> +1</li>
      <li><span class="tag">⚡ Power Plant</span> +1 &nbsp; <span class="tag">✚ Military Hospital</span> +1</li>
      <li><span class="tag">◈ Military Base Levie</span> +1</li>
      <li><span class="tag">◈ Coastal Base Lamentin</span> +1 &nbsp; <span class="tag">◈ Coastal Base Chotain</span> +1 &nbsp; <span class="tag">◈ Coastal Base Morton</span> +1</li>
    </ul>
    <h2>Everon rules</h2>
    <ul>
      <li><span class="tag">▲ High ground.</span> Pennants Pass, Durras and Saint-Pierre command the southeastern approaches, and Calvary Hill overlooks the west. The defender adds +1 to their highest die. Attacking uphill is expensive.</li>
      <li><span class="tag">⚓ Naval landing.</span> Once per turn you may attack from a port you hold directly into any other port on the island. Meaux, Gravette, Camurac, Saint-Pierre and the coastal bases at Lamentin, Chotain and Morton are ports.</li>
    </ul>
    <h2>Submarines</h2>
    <p>You may keep one boat at sea. Commission it during Deploy for <span class="tag">8 reinforcements</span>, or <span class="tag">4</span> if you hold the naval base at Saint-Pierre, stationed at any port you hold. It patrols the <em>region</em> it sits in, screening every port you hold there — those ports show a dashed ring.</p>
    <p>A submarine does nothing against attacks that come overland. It is a picket, not a garrison. Redeploy it to another port you hold once per turn, during Fortify.</p>
    <h2>Running a blockade</h2>
    <p>Sail a naval landing at a screened port and the submarine intercepts you before the beach. The engagement runs in rounds:</p>
    <ul>
      <li>You get <span class="tag">three passes</span>, no more. Each pass you roll up to 3 dice, the boat rolls 2 and adds +1 to its highest — submerged, it is hard to hit. Ties to the boat. Your losses come off the origin, lost at sea before landing.</li>
      <li>The boat has a hull of <span class="tag">3</span>. Land three hits inside three passes and it goes down; the port is then open to your assault.</li>
      <li>Between passes you may <span class="tag">break off</span>, at a cost of 2 troops covering the withdrawal. Run out of passes, or out of convoy, and you are driven off for nothing.</li>
      <li>Either way the landing is used up for the turn.</li>
    </ul>
    <p>The other answer to a submarine is a land offensive: take the port it is stationed at and it goes down with its base.</p>
    <h2>Winning</h2>
    <p>Take the whole island, or begin your turn holding five of the seven regions.</p>
    <h2>Map credit</h2>
    <p>The satellite board is built from the open-source <span class="tag">EnfusionMapMaker</span> project by nickludlam, Arma Public License Share Alike. Everon and Arma Reforger are Bohemia Interactive. Territory positions come from game coordinates on the 12.8 km terrain.</p>
    <h2>Why the map plays the way it does</h2>
    <p>Hornbeam Valley is the busiest junction on the island with six roads, and Montignac behind it has five — between them they carry everything moving north to south. Only three roads leave the northern peninsula, from Meaux, Kermovan and Tyrone, so the whole north funnels through a narrow neck.</p>
    <p>The southeast is a corridor: two ways in, hard to break, and a trap once you are bottled up in it. Two positions are true dead ends, <span class="tag">Coastal Base Lamentin</span> in the far west and <span class="tag">Saint-Pierre</span> in the south-east — each has a single road, and both are ports. That is not a coincidence. If you want them, or want to break out of them, the water is the other way.</p>
    <div style="margin-top:16px"><button class="act primary" id="closeRules" style="width:100%">Close</button></div>`);
  o.querySelector("#closeRules").onclick=()=>o.remove();
}

}

      if(m==="narrower"){ BG.w-=16; BG.x+=8; }
      if(m==="taller"){ BG.h+=16; BG.y-=8; }
      if(m==="shorter"){ BG.h-=16; BG.y+=8; }
      if(m==="bigger"){ BG.w+=16; BG.h+=16; BG.x-=8; BG.y-=8; }

  draw();
}

/* ============================================================
   Map editor — add positions, link roads, retune regions.
   Everything here writes to T / RAW_ADJ / REGIONS and calls rebuild().
   ============================================================ */
let ED = {on:false, sel:null, mode:null, dirty:false};
// var (not let) — wireMap assigns this while the script is still executing.


const ICONS = ["","✈","⚡","◈","✚","▣","☗","⌖","⚑"];
const TERRAINS = ["plain","forest","coast","highland"];

function slug(name){
  let base = name.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,14) || "pos";
  let id = base, n = 2;
  while(TT[id]) id = base + (n++);
  return id;
}

function edDirty(){ ED.dirty=true; rebuild(); render(); }

function enterEditor(){
  ED.on=true; ED.sel=null; ED.mode=null;
  log("Map editor opened. Changes start a fresh campaign.", true);
  render();
}
function exitEditor(){
  ED.on=false; ED.mode=null; ED.sel=null;
  if(ED.dirty){ ED.dirty=false; rebuild(); showSetup(); }
  else render();
}

function edGroundTap(pt){
  if(ED.mode==="move" && ED.sel){
    TT[ED.sel].x=pt.x; TT[ED.sel].y=pt.y; ED.mode=null; edDirty(); return;
  }
  if(ED.mode!=="add") return;
  const name = "New position " + (T.length+1);
  const t = {id:slug(name), name, r:Object.keys(REGIONS)[0], x:pt.x, y:pt.y,
             t:"plain", port:false, income:0};
  T.push(t); RAW_ADJ[t.id]=[];
  ED.sel=t.id; ED.mode=null; edDirty();
  edDetails();
}

function edNodeTap(id){
  if(ED.mode==="link" && ED.sel && id!==ED.sel){
    const a=ED.sel, b=id;
    RAW_ADJ[a]=RAW_ADJ[a]||[]; RAW_ADJ[b]=RAW_ADJ[b]||[];
    const linked=(ADJ[a]||[]).includes(b);
    RAW_ADJ[a]=RAW_ADJ[a].filter(x=>x!==b);
    RAW_ADJ[b]=RAW_ADJ[b].filter(x=>x!==a);
    if(!linked) RAW_ADJ[a].push(b);
    edDirty(); return;
  }
  if(ED.mode==="move" && ED.sel){ ED.mode=null; }
  ED.sel=id; render();
}

function renderEdStatus(){
  const roads = new Set();
  Object.keys(ADJ).forEach(a=>ADJ[a].forEach(b=>roads.add([a,b].sort().join("|"))));
  const orphans = T.filter(t=>!(ADJ[t.id]||[]).length).length;
  const st=$("status"); st.classList.add("editing");
  st.innerHTML = `
    <div class="cell"><span class="lbl">Mode</span><span class="val">Editing</span></div>
    <div class="cell"><span class="lbl">Positions</span><span class="val">${T.length}</span></div>
    <div class="cell"><span class="lbl">Roads</span><span class="val">${roads.size}</span></div>
    <div class="cell"><span class="lbl">Unlinked</span><span class="val" style="color:${orphans?"#e2887f":"inherit"}">${orphans}</span></div>`;
}

function renderEdConsole(){
  const A=$("actions"); A.innerHTML="";
  const sel = ED.sel ? TT[ED.sel] : null;

  $("prompt").innerHTML =
    ED.mode==="add"  ? `<b>Add position</b> — tap open ground on the map.` :
    ED.mode==="link" ? `<b>Link roads</b> — tap neighbours of ${sel.name} to connect or disconnect.` :
    ED.mode==="move" ? `<b>Move</b> — tap where ${sel.name} should sit.` :
    sel ? `<b>${sel.name}</b> selected.` :
          `<b>Map editor</b> — tap a position to select, or add a new one.`;

  $("detail").textContent = sel
    ? [ (REGIONS[sel.r]||{name:"no region"}).name, sel.t,
        `${(ADJ[sel.id]||[]).length} road${(ADJ[sel.id]||[]).length===1?"":"s"}`,
        sel.port?"port":null, sel.income?`+${sel.income} income`:null,
        sel.airbase?"airlift":null ].filter(Boolean).join(" · ")
    : "The number on each counter is how many roads reach it.";

  A.append(btn("Add position", {on:ED.mode==="add",
    fn:()=>{ ED.mode = ED.mode==="add"?null:"add"; render(); }}));
  A.append(btn("Link roads", {on:ED.mode==="link", dis:!sel,
    fn:()=>{ ED.mode = ED.mode==="link"?null:"link"; render(); }}));
  A.append(btn("Move", {on:ED.mode==="move", dis:!sel,
    fn:()=>{ ED.mode = ED.mode==="move"?null:"move"; render(); }}));
  A.append(btn("Details", {dis:!sel, fn:edDetails}));
  A.append(btn("Delete", {dis:!sel || T.length<=3, cls:"danger", fn:()=>{
    const id=sel.id;
    T = T.filter(t=>t.id!==id);
    delete RAW_ADJ[id];
    Object.keys(RAW_ADJ).forEach(k=>RAW_ADJ[k]=RAW_ADJ[k].filter(x=>x!==id));
    ED.sel=null; ED.mode=null; edDirty();
  }}));
  A.append(btn("Regions", {fn:edRegions}));
  A.append(btn("Save / load", {fn:edFiles}));
  A.append(btn("Done", {cls:"primary", fn:exitEditor}));
}

function edDetails(){
  const t = TT[ED.sel]; if(!t) return;
  const o = overlay("");
  const draw=()=>{
    o.querySelector(".sheet").innerHTML = `
      <h1>Position</h1>
      <span class="edlbl">Name</span>
      <input class="fld" id="fName" value="${(t.name||"").replace(/"/g,"&quot;")}">
      <span class="edlbl">Region</span>
      <div class="pillrow">${Object.keys(REGIONS).map(k=>
        `<button class="pill ${t.r===k?"on":""}" data-rg="${k}">${REGIONS[k].name}</button>`).join("")}</div>
      <span class="edlbl">Terrain</span>
      <div class="pillrow">${TERRAINS.map(k=>
        `<button class="pill ${t.t===k?"on":""}" data-tr="${k}">${k}</button>`).join("")}</div>
      <p style="font-size:11px;color:#8d9480;margin-top:-6px">Highland gives the defender +1 on their highest die.</p>
      <span class="edlbl">Reinforcements per turn</span>
      <div class="pillrow">${[0,1,2,3].map(n=>
        `<button class="pill ${(t.income||0)===n?"on":""}" data-in="${n}">+${n}</button>`).join("")}</div>
      <span class="edlbl">Counter marking</span>
      <div class="pillrow">${ICONS.map(ic=>
        `<button class="pill ${(t.icon||"")===ic?"on":""}" data-ic="${ic}">${ic||"none"}</button>`).join("")}</div>
      <span class="edlbl">Installation name (shown when selected)</span>
      <input class="fld" id="fInst" value="${(t.inst||"").replace(/"/g,"&quot;")}" placeholder="e.g. Ammo Depot Old Wood">
      <div class="pillrow">
        <button class="pill ${t.port?"on":""}" data-tg="port">⚓ Port</button>
        <button class="pill ${t.airbase?"on":""}" data-tg="airbase">✈ Grants airlift</button>
      </div>
      <p style="font-size:11px;color:#8d9480">Ports can launch one naval landing per turn against any other port. An airlift moves troops between any two territories you hold.</p>
      <div style="margin-top:14px"><button class="act primary" id="fDone" style="width:100%">Save position</button></div>`;
    o.querySelectorAll("[data-rg]").forEach(b=>b.onclick=()=>{t.r=b.dataset.rg;draw();});
    o.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{t.t=b.dataset.tr;draw();});
    o.querySelectorAll("[data-in]").forEach(b=>b.onclick=()=>{t.income=+b.dataset.in;draw();});
    o.querySelectorAll("[data-ic]").forEach(b=>b.onclick=()=>{t.icon=b.dataset.ic;draw();});
    o.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{t[b.dataset.tg]=!t[b.dataset.tg];draw();});
    o.querySelector("#fDone").onclick=()=>{
      t.name = o.querySelector("#fName").value.trim() || t.name;
      t.inst = o.querySelector("#fInst").value.trim();
      o.remove(); edDirty();
    };
  };
  draw();
}

function edRegions(){
  const o = overlay("");
  const draw=()=>{
    o.querySelector(".sheet").innerHTML = `
      <h1>Regions</h1>
      <p style="color:#8d9480">Hold every position in a region and you collect its bonus each turn.</p>
      ${Object.keys(REGIONS).map(k=>{
        const n=T.filter(t=>t.r===k).length;
        return `<div class="seatrow">
          <span class="swatch" style="background:${REGIONS[k].tint};width:12px;height:12px"></span>
          <span class="nm">${REGIONS[k].name}<br><span style="font-size:10px;color:#8d9480">${n} position${n===1?"":"s"}</span></span>
          <button class="pill" data-dn="${k}">&minus;</button>
          <button class="pill on" style="min-width:34px;text-align:center">+${REGIONS[k].bonus}</button>
          <button class="pill" data-up="${k}">+</button>
          ${n?"":`<button class="pill" data-del="${k}">Delete</button>`}
        </div>`;}).join("")}
      <h2>New region</h2>
      <input class="fld" id="rName" placeholder="Region name">
      <div style="display:flex;gap:8px">
        <button class="act" id="rAdd" style="flex:1">Add region</button>
        <button class="act primary" id="rDone" style="flex:1">Done</button>
      </div>`;
    o.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{
      REGIONS[b.dataset.up].bonus=Math.min(9,REGIONS[b.dataset.up].bonus+1); ED.dirty=true; draw(); });
    o.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{
      REGIONS[b.dataset.dn].bonus=Math.max(0,REGIONS[b.dataset.dn].bonus-1); ED.dirty=true; draw(); });
    o.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
      if(Object.keys(REGIONS).length>1){ delete REGIONS[b.dataset.del]; ED.dirty=true; draw(); } });
    o.querySelector("#rAdd").onclick=()=>{
      const nm=o.querySelector("#rName").value.trim(); if(!nm) return;
      let key=nm.toLowerCase().replace(/[^a-z0-9]/g,"")||"region", n=2;
      while(REGIONS[key]) key=key+(n++);
      const tints=["#b9c191","#c6c8a3","#bfc59c","#b5be8d","#c3c69f","#aeb684","#cbc59a","#a9b58e"];
      REGIONS[key]={name:nm, bonus:2, tint:tints[Object.keys(REGIONS).length % tints.length]};
      ED.dirty=true; draw();
    };
    o.querySelector("#rDone").onclick=()=>{ o.remove(); edDirty(); };
  };
  draw();
}

function edFiles(){
  const o = overlay(`
    <h1>Save or load a map</h1>
    <p style="color:#8d9480">Your map is a small JSON file — positions, roads and regions. Keep it, edit it by hand, or send it to someone else.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
      <button class="act" id="mExport">Download this map</button>
      <input type="file" id="mFile" accept=".json,application/json" style="display:none">
      <button class="act" id="mImport">Load a map file</button>
      <button class="act danger" id="mReset">Restore the default Everon map</button>
      <button class="act primary" id="mDone">Close</button>
    </div>
    <p id="mMsg" style="font-size:11px;color:#8d9480;margin-top:10px"></p>`);
  o.querySelector("#mExport").onclick=()=>{
    const blob=new Blob([JSON.stringify({regions:REGIONS,territories:T,roads:RAW_ADJ},null,1)],
                        {type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="everon-map.json"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  };
  o.querySelector("#mImport").onclick=()=>o.querySelector("#mFile").click();
  o.querySelector("#mFile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!Array.isArray(d.territories) || !d.territories.length) throw 0;
        REGIONS=d.regions||REGIONS; T=d.territories; RAW_ADJ=d.roads||{};
        T.forEach(t=>{ if(!REGIONS[t.r]) t.r=Object.keys(REGIONS)[0]; });
        ED.sel=null; o.remove(); edDirty();
      }catch(err){
        o.querySelector("#mMsg").textContent="That file isn't a map. It needs regions, territories and roads.";
      }
    };
    fr.readAsText(f);
  };
  o.querySelector("#mReset").onclick=()=>{
    const d=JSON.parse(DEFAULT_MAP_DATA);
    REGIONS=d.regions; T=d.territories; RAW_ADJ=d.roads;
    ED.sel=null; o.remove(); edDirty();
  };
  o.querySelector("#mDone").onclick=()=>o.remove();
}

$("btnEdit").onclick=()=>{ ED.on ? exitEditor() : enterEditor(); };

/* boot */
function boot(){
  const el = document.getElementById("terrain");
  const raw = el ? el.textContent.trim() : "";
  if(/^data:image\/jpeg;base64,[A-Za-z0-9+/=]{10000,}$/.test(raw)){
    DEFAULT_MAP = raw; BG.url = raw; BG.name = "Everon terrain (bundled)";
  } else {
    BG.url = null;          // drawn vector map instead — everything still plays
  }
  rebuild();
  // A playable game exists before the setup panel is offered, so a viewer that
  // fails to draw the overlay still leaves something you can use.
  newGame([{f:0,ai:false},{f:1,ai:true}], "mob", true);
  showSetup();
}

try {
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
} catch(err){
  document.body.innerHTML =
    '<div style="padding:24px;font-family:monospace;color:#e3e6da;background:#141811;min-height:100vh">'
    + '<h2 style="color:#d9a441;letter-spacing:.2em">EVERON CONFLICT</h2>'
    + '<p>The game failed to start on this browser.</p><p style="color:#8d9480">'
    + String(err && err.message ? err.message : err) + '</p>'
    + '<p style="color:#8d9480">If the file was sent through a chat app it may have been altered in transit — '
    + 'it should be about 496 KB. Try a fresh copy, or open it in Chrome, Safari or Firefox rather than '
    + 'an in-app browser.</p></div>';
}
</script>
